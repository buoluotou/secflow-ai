# =====================================================================
# SecFlow AI — production compose (spec §44, §45)
#   docker compose -f docker-compose.prod.yml up -d
#
# 生产建议：置于反向代理 (Nginx/Traefik + TLS) 之后，
# 只暴露 80/443；数据库与 Redis 只进内部网络。
# =====================================================================

name: secflow-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secflow}
      POSTGRES_USER: ${POSTGRES_USER:-secflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - secflow-internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - secflow-internal

  secflow-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - secflow_data:/data
      - secflow_logs:/logs
      - secflow_reports:/reports
    expose:
      - "8000"
    networks:
      - secflow-internal
      - secflow-net

  secflow-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - secflow_data:/data
      - secflow_logs:/logs
      - secflow_reports:/reports
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - secflow-internal
      - secflow-net

  secflow-scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - secflow-internal

  secflow-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - secflow-api
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - secflow-net

volumes:
  postgres_prod:
  redis_prod:
  secflow_data:
  secflow_logs:
  secflow_reports:

networks:
  secflow-net:
    name: secflow-net
    external: true
  secflow-internal:
    name: secflow-internal
    driver: bridge
